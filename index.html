<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08020d">
<title>♥ Koło Fortuny ♥</title>
<style>
:root{--bg:#08020d;--pink:#ff1493;--hot:#ff4db8;--soft:#ffd1ec;--card:#160818}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 10%,#420a2d 0,#180516 34%,#08020d 78%);color:#fff;font-family:Arial,sans-serif}
body{overflow-x:hidden}
.app{max-width:520px;margin:auto;padding:20px 14px 38px;text-align:center;position:relative}
.content{position:relative;z-index:2}
.float-heart{position:fixed;z-index:1;color:var(--pink);opacity:.14;pointer-events:none;font-size:28px;animation:up 11s linear infinite}
.h1{left:7%;bottom:-40px}.h2{left:29%;bottom:-90px;animation-delay:2s}.h3{left:64%;bottom:-70px;animation-delay:4s}.h4{right:6%;bottom:-110px;animation-delay:6s}
@keyframes up{to{transform:translateY(-125vh) rotate(25deg);opacity:0}}
.kicker{font-size:12px;font-weight:900;letter-spacing:3px;color:var(--hot);text-shadow:0 0 14px var(--pink)}
h1{margin:7px 0 5px;font-size:clamp(32px,9vw,46px);line-height:1;text-shadow:0 0 8px #fff,0 0 20px var(--pink),0 0 42px var(--pink)}
.subtitle{color:#d9a6c8;font-size:14px;margin:8px 0 18px}
.user-greeting{min-height:20px;color:var(--soft);font-size:13px;font-weight:700;margin-bottom:7px}
.wheel-wrap{width:min(90vw,420px);height:min(90vw,420px);margin:auto;position:relative}
#wheel{display:block;width:100%;height:100%;border-radius:50%;filter:drop-shadow(0 0 12px var(--pink)) drop-shadow(0 0 30px rgba(255,20,147,.55))}
.ring{position:absolute;inset:-7px;border:3px solid var(--pink);border-radius:50%;box-shadow:0 0 8px var(--pink),0 0 28px var(--pink),inset 0 0 20px rgba(255,20,147,.5);pointer-events:none}
.pointer{position:absolute;z-index:4;top:-13px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:42px solid #fff;filter:drop-shadow(0 0 7px var(--pink)) drop-shadow(0 0 15px var(--pink))}
.center{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#ff9bd5,#ff1493 55%,#920052);border:4px solid #fff;box-shadow:0 0 10px #fff,0 0 25px var(--pink);font-size:12px;font-weight:900;text-shadow:0 2px 4px #70003e}
button,.link{width:min(92vw,380px);margin:17px auto 10px;padding:15px 18px;border-radius:17px;font-size:18px;font-weight:900;text-align:center;display:block}
button{border:2px solid var(--hot);background:linear-gradient(135deg,#ff1493,#bd0069);color:#fff;box-shadow:0 0 10px var(--pink),0 0 25px rgba(255,20,147,.7),0 6px 0 #70003e;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(5px);box-shadow:0 0 10px var(--pink),0 1px 0 #70003e}
button:disabled{opacity:.5;cursor:not-allowed}
.link{margin-top:10px;text-decoration:none;color:#fff;border:1px solid var(--hot);background:rgba(255,20,147,.09);box-shadow:0 0 10px rgba(255,20,147,.4)}
.card{width:min(92vw,380px);margin:14px auto 0;padding:14px;border-radius:18px;border:1px solid rgba(255,77,184,.4);background:rgba(255,20,147,.08);box-shadow:0 0 18px rgba(255,20,147,.18)}
.result{display:none}.result.show{display:block;animation:pop .4s ease}.result .big{font-size:40px;text-shadow:0 0 18px var(--pink)}.won{font-size:12px;letter-spacing:2px;color:var(--hot);font-weight:900}.prize{font-size:23px;font-weight:900;margin-top:5px;text-shadow:0 0 12px var(--pink)}
.code{margin:11px auto 9px;padding:10px;border:1px dashed var(--hot);border-radius:10px;background:#0c030d;color:#fff;font-weight:900;letter-spacing:2px;font-size:20px}
.copy{width:100%;margin:0;padding:11px;font-size:14px;box-shadow:none;background:rgba(255,20,147,.18)}
.copy.copied{background:#a80060}
.timer{display:none;color:#d9a6c8;font-size:13px}.timer.show{display:block}.timer strong{display:block;color:#fff;font-size:21px;letter-spacing:2px;margin-top:5px;text-shadow:0 0 10px var(--pink)}
.best{color:#d9a6c8;font-size:13px;line-height:1.5}.best strong{display:block;color:#fff;font-size:17px;margin-top:3px;text-shadow:0 0 10px var(--pink)}
.stats{display:flex;gap:8px;justify-content:center}.stat{flex:1;padding:10px 6px;border-radius:12px;background:rgba(255,20,147,.07);border:1px solid rgba(255,77,184,.25);color:#d9a6c8;font-size:11px}.stat b{display:block;color:#fff;font-size:17px;margin-bottom:2px}
.history{text-align:left}.history h3{margin:0 0 8px;color:#fff;font-size:15px}.history-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(255,77,184,.15);font-size:12px;color:#d9a6c8}.history-item b{color:#fff}
.note{margin-top:17px;color:#a87999;font-size:11px}
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,0,5,.78);backdrop-filter:blur(7px)}.modal.show{display:flex}
.modal-box{width:min(92vw,380px);padding:22px;border-radius:22px;border:2px solid var(--hot);background:linear-gradient(180deg,#21081c,#0c030d);box-shadow:0 0 15px var(--pink),0 0 50px rgba(255,20,147,.5);text-align:center;animation:pop .35s ease}
.modal-title{font-size:27px;font-weight:1000;text-shadow:0 0 15px var(--pink)}.modal-sub{color:#d9a6c8;font-size:13px;margin:7px 0 14px}.close{margin:0;background:rgba(255,20,147,.15);box-shadow:none;font-size:14px;padding:11px}
@keyframes pop{0%{opacity:0;transform:scale(.75)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
.confetti{position:fixed;z-index:40;pointer-events:none;font-size:24px;animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(240deg) scale(1.3);opacity:0}}
</style>
</head>
<body>
<div class="float-heart h1">♥</div><div class="float-heart h2">♡</div><div class="float-heart h3">♥</div><div class="float-heart h4">♡</div>

<main class="app">
<div class="content">
<div id="greeting" class="user-greeting"></div>
<div class="kicker">♥ TWOJA SZANSA ♥</div>
<h1>KOŁO FORTUNY</h1>
<div class="subtitle">Zakręć kołem i sprawdź swoją nagrodę ✨</div>

<div class="wheel-wrap">
<div class="pointer"></div>
<canvas id="wheel" width="900" height="900"></canvas>
<div class="ring"></div>
<div class="center">♥<br>FORTUNA</div>
</div>

<button id="spin" type="button">♥ ZAKRĘĆ KOŁEM ♥</button>

<a class="link" href="TU_WKLEJ_LINK_DO_PROBEK" target="_blank" rel="noopener">♥ PRÓBKI ♥</a>
<a class="link" href="TU_WKLEJ_LINK_DO_INFORMACJI_O_MNIE" target="_blank" rel="noopener">♥ INFORMACJE O MNIE ♥</a>

<div id="result" class="card result"></div>
<div id="timer" class="card timer"></div>

<div class="card best">🔥 Dzisiejsza najlepsza wygrana<strong id="bestPrize">Jeszcze nikt nie wygrał</strong></div>

<div class="card stats">
<div class="stat"><b id="spinCount">0</b>losowań</div>
<div class="stat"><b id="winCount">0</b>wygranych</div>
<div class="stat"><b id="bestShort">—</b>najlepsza</div>
</div>

<div class="card history">
<h3>♥ Twoja ostatnia wygrana</h3>
<div id="historyList">Brak losowań</div>
</div>

<div class="note">Jedno losowanie na 24 godziny ♥</div>
</div>
</main>

<div id="modal" class="modal">
<div class="modal-box">
<div class="modal-title" id="modalTitle">♥ PAKIET ♥</div>
<div class="modal-sub" id="modalSub"></div>
<div id="modalCode"></div>
<button id="closeModal" class="close" type="button">ZAMKNIJ ♥</button>
</div>
</div>

<script>
(function(){
"use strict";

var canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
var btn=document.getElementById("spin"),result=document.getElementById("result"),timer=document.getElementById("timer");
var modal=document.getElementById("modal"),modalTitle=document.getElementById("modalTitle"),modalSub=document.getElementById("modalSub"),modalCode=document.getElementById("modalCode");
var greeting=document.getElementById("greeting");

var prizes=[
{name:"PAKIET",emoji:"🎁",color:"#ff1493",weight:2,code:"PAKIET"},
{name:"ZNIŻKA 15%",emoji:"💗",color:"#8b0053",weight:8,code:"HEART15"},
{name:"SPRÓBUJ PONOWNIE",emoji:"♥",color:"#25091f",weight:18},
{name:"ZNIŻKA 10%",emoji:"💗",color:"#d40078",weight:12,code:"HEART10"},
{name:"SPRÓBUJ PONOWNIE",emoji:"♥",color:"#3a0b2d",weight:18},
{name:"ZNIŻKA 5%",emoji:"💗",color:"#ff4db8",weight:17,code:"HEART05"},
{name:"SPRÓBUJ PONOWNIE",emoji:"♥",color:"#210718",weight:17},
{name:"ZNIŻKA 10%",emoji:"💗",color:"#a80060",weight:8,code:"HEART10"}
];

var TAU=Math.PI*2,part=TAU/prizes.length,rotation=0,spinning=false;
var KEY="kolo_fortuny_v3",DAY=86400000;

function state(){
try{return JSON.parse(localStorage.getItem(KEY)||'{"last":0,"spins":0,"wins":0,"history":[],"best":"—"}')}catch(e){return {last:0,spins:0,wins:0,history:[],best:"—"}}
}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
function draw(){
var c=450,r=434;ctx.clearRect(0,0,900,900);
for(var i=0;i<prizes.length;i++){
var a=rotation+i*part,b=a+part;
ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,b);ctx.closePath();
ctx.fillStyle=prizes[i].color;ctx.fill();ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=7;ctx.stroke();
ctx.save();ctx.translate(c,c);ctx.rotate(a+part/2);ctx.textAlign="right";ctx.fillStyle="#fff";ctx.shadowColor="#ff1493";ctx.shadowBlur=10;
ctx.font=prizes[i].name==="SPRÓBUJ PONOWNIE"?"900 21px Arial":"900 28px Arial";ctx.fillText(prizes[i].name,r-30,8);ctx.restore();
}
ctx.beginPath();ctx.arc(c,c,r,0,TAU);ctx.strokeStyle="#fff";ctx.lineWidth=9;ctx.shadowColor="#ff1493";ctx.shadowBlur=18;ctx.stroke();ctx.shadowBlur=0;
}
function choose(){
var total=0,n;for(var i=0;i<prizes.length;i++)total+=prizes[i].weight;n=Math.random()*total;
for(var j=0;j<prizes.length;j++){n-=prizes[j].weight;if(n<=0)return j}return prizes.length-1;
}
function norm(a){return((a%TAU)+TAU)%TAU}
function updateUI(){
var s=state(),left=DAY-(Date.now()-s.last);
document.getElementById("spinCount").textContent=s.spins;
document.getElementById("winCount").textContent=s.wins;
document.getElementById("bestPrize").textContent=s.best||"Jeszcze nikt nie wygrał";
document.getElementById("bestShort").textContent=s.best==="PAKIET"?"🎁":(s.best&&s.best!=="—"?s.best.replace("ZNIŻKA ",""):"—");
if(s.history.length){
document.getElementById("historyList").innerHTML=s.history.slice(0,3).map(function(x){return '<div class="history-item"><b>'+x.prize+'</b><span>'+x.date+'</span></div>'}).join("");
}
if(!s.last||left<=0){btn.disabled=false;btn.textContent="♥ ZAKRĘĆ KOŁEM ♥";timer.className="card timer";return}
btn.disabled=true;btn.textContent="♥ WRÓĆ PÓŹNIEJ ♥";timer.className="card timer show";
var sec=Math.ceil(left/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),ss=sec%60;
timer.innerHTML="Następne losowanie za:<strong>"+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0")+"</strong>";
}
function codeFor(p){return p.code||""}
function showModal(p){
modalTitle.textContent=p.name==="PAKIET"?"🎁 ♥ PAKIET ♥":p.emoji+" "+p.name;
modalSub.textContent=p.name==="PAKIET"?"To Twoja najlepsza nagroda! ♥":p.name==="SPRÓBUJ PONOWNIE"?"Tym razem bez nagrody — spróbuj ponownie jutro ♥":"Twój rabat jest gotowy ♥";
if(codeFor(p)){modalCode.innerHTML='<div class="code">'+codeFor(p)+'</div><button type="button" class="copy" id="copyBtn">KOPIUJ KOD ♥</button>';document.getElementById("copyBtn").onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(codeFor(p));this.textContent="SKOPIOWANO ♥";this.classList.add("copied")}}
else modalCode.innerHTML="";
modal.className="modal show";
}
function celebrate(){
var chars=["♥","♥","♡","💗","✨","♥"];
for(var i=0;i<24;i++){var e=document.createElement("div");e.className="confetti";e.textContent=chars[Math.floor(Math.random()*chars.length)];e.style.left="50%";e.style.top="48%";e.style.color=i%2?"#ff8bd2":"#ff1493";e.style.setProperty("--x",(Math.random()*420-210)+"px");e.style.setProperty("--y",(Math.random()*420-210)+"px");document.body.appendChild(e);setTimeout(function(){e.remove()},1200)}
}
function showResult(p){
result.innerHTML='<div class="big">♥</div><div class="won">GRATULACJE!</div><div class="prize">'+p.emoji+" "+p.name+"</div>";
if(p.code)result.innerHTML+='<div class="code">'+p.code+'</div><div style="font-size:11px;color:#d9a6c8">Kod możesz skopiować w oknie nagrody ♥</div>';
result.className="card result show";celebrate();showModal(p);
}
function spin(){
if(spinning)return;
var s=state();if(s.last&&Date.now()-s.last<DAY){updateUI();return}
spinning=true;btn.disabled=true;result.className="card result";
var winner=choose(),target=winner*part+part/2,pointer=-Math.PI/2,current=norm(rotation),diff=norm(pointer-target)-current;
if(diff<0)diff+=TAU;
var start=rotation,finish=rotation+diff+(5+Math.floor(Math.random()*3))*TAU,duration=5200,t0=performance.now();
function frame(now){
var p=Math.min((now-t0)/duration,1),ease=1-Math.pow(1-p,4);rotation=start+(finish-start)*ease;draw();
if(p<1)requestAnimationFrame(frame);else{rotation=finish;draw();
var prize=prizes[winner],nowDate=new Date();
s.last=Date.now();s.spins++;
if(prize.name!=="SPRÓBUJ PONOWNIE"){s.wins++;if(prize.name==="PAKIET"||s.best==="—"||(prize.name==="ZNIŻKA 15%"&&s.best!=="PAKIET"))s.best=prize.name}
s.history.unshift({prize:prize.name,date:nowDate.toLocaleDateString("pl-PL")+" "+nowDate.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"})});
s.history=s.history.slice(0,5);save(s);
setTimeout(function(){showResult(prize);spinning=false;updateUI()},250);
}}
requestAnimationFrame(frame);
}
function telegramGreeting(){
try{
if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();var u=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user;if(u)greeting.textContent="Cześć, "+(u.first_name||"♥")+" ♥";}
}catch(e){}
}
document.getElementById("closeModal").onclick=function(){modal.className="modal"};
modal.onclick=function(e){if(e.target===modal)modal.className="modal"};
btn.addEventListener("click",spin);
telegramGreeting();draw();updateUI();setInterval(updateUI,1000);
})();
</script>
</body>
</html>
