<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>♥ Koło Fortuny ♥</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #09020d;
      --bg2: #16051d;
      --pink: #ff1493;
      --pink2: #ff4db8;
      --pink3: #ff8bd2;
      --white: #fff7fd;
      --muted: #d9a9cb;
      --card: rgba(255, 20, 147, 0.08);
      --line: rgba(255, 77, 184, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 20, 147, .18), transparent 35%),
        radial-gradient(circle at 10% 90%, rgba(255, 20, 147, .10), transparent 30%),
        var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      color: var(--pink);
      opacity: .13;
      font-size: 18px;
      animation: floatUp linear infinite;
      text-shadow: 0 0 12px var(--pink);
    }

    .heart:nth-child(1) { left: 7%;  top: 82%; animation-duration: 8s;  font-size: 22px; }
    .heart:nth-child(2) { left: 18%; top: 60%; animation-duration: 11s; font-size: 14px; }
    .heart:nth-child(3) { left: 31%; top: 90%; animation-duration: 9s;  font-size: 28px; }
    .heart:nth-child(4) { left: 47%; top: 70%; animation-duration: 12s; font-size: 16px; }
    .heart:nth-child(5) { left: 62%; top: 88%; animation-duration: 10s; font-size: 24px; }
    .heart:nth-child(6) { left: 77%; top: 65%; animation-duration: 8s;  font-size: 18px; }
    .heart:nth-child(7) { left: 90%; top: 85%; animation-duration: 13s; font-size: 30px; }
    .heart:nth-child(8) { left: 54%; top: 40%; animation-duration: 14s; font-size: 12px; }

    @keyframes floatUp {
      0%   { transform: translateY(30vh) scale(.8) rotate(0deg); opacity: 0; }
      15%  { opacity: .16; }
      85%  { opacity: .10; }
      100% { transform: translateY(-120vh) scale(1.3) rotate(25deg); opacity: 0; }
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 14px 35px;
      text-align: center;
    }

    .brand {
      margin-top: 5px;
      font-size: 15px;
      letter-spacing: 3px;
      color: var(--pink3);
      text-shadow: 0 0 12px var(--pink);
      font-weight: 800;
    }

    h1 {
      margin: 7px 0 4px;
      font-size: clamp(32px, 9vw, 46px);
      line-height: 1;
      font-weight: 1000;
      color: #fff;
      text-shadow:
        0 0 8px rgba(255,255,255,.55),
        0 0 18px var(--pink),
        0 0 40px var(--pink);
    }

    .subtitle {
      margin: 9px auto 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .wheel-area {
      position: relative;
      width: min(92vw, 430px);
      height: min(92vw, 430px);
      margin: 0 auto 24px;
    }

    .neon-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 3px solid var(--pink);
      box-shadow:
        0 0 8px var(--pink),
        0 0 22px var(--pink),
        0 0 55px rgba(255,20,147,.65),
        inset 0 0 20px rgba(255,20,147,.45);
      pointer-events: none;
      z-index: 4;
    }

    .pointer {
      position: absolute;
      z-index: 8;
      left: 50%;
      top: -13px;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 42px solid #fff;
      filter:
        drop-shadow(0 0 5px var(--pink))
        drop-shadow(0 0 13px var(--pink));
    }

    canvas {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      background: #14051a;
    }

    .center {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: 50%;
      width: 88px;
      height: 88px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle, #ffb9e2 0%, #ff1493 45%, #b90068 100%);
      border: 4px solid #fff;
      box-shadow:
        0 0 8px #fff,
        0 0 22px var(--pink),
        0 0 42px var(--pink);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 1000;
      text-shadow: 0 2px 4px #7d0047;
    }

    .spin-button {
      width: min(92vw, 380px);
      border: 2px solid var(--pink2);
      border-radius: 18px;
      padding: 16px 22px;
      background: linear-gradient(135deg, #ff1493, #c90070);
      color: #fff;
      font-size: 20px;
      font-weight: 1000;
      letter-spacing: .5px;
      box-shadow:
        0 0 8px var(--pink),
        0 0 22px rgba(255,20,147,.8),
        0 7px 0 #70003e;
      cursor: pointer;
      transition: transform .12s ease, filter .2s ease;
    }

    .spin-button:active {
      transform: translateY(6px);
      box-shadow:
        0 0 8px var(--pink),
        0 0 22px rgba(255,20,147,.8),
        0 1px 0 #70003e;
    }

    .spin-button:disabled {
      opacity: .5;
      filter: grayscale(.35);
      cursor: not-allowed;
    }

    .result {
      margin: 22px auto 0;
      width: min(92vw, 380px);
      padding: 18px 14px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: linear-gradient(
        180deg,
        rgba(255,20,147,.18),
        rgba(255,20,147,.06)
      );
      box-shadow:
        0 0 12px rgba(255,20,147,.35),
        inset 0 0 20px rgba(255,20,147,.08);
      display: none;
    }

    .result.show {
      display: block;
      animation: resultPop .45s ease;
    }

    .result .big-heart {
      display: block;
      font-size: 38px;
      line-height: 1;
      margin-bottom: 8px;
      color: #fff;
      text-shadow: 0 0 10px #fff, 0 0 25px var(--pink);
    }

    .result .won {
      color: var(--pink3);
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 900;
    }

    .result .prize {
      margin-top: 5px;
      font-size: 24px;
      font-weight: 1000;
      color: #fff;
      text-shadow: 0 0 14px var(--pink);
    }

    @keyframes resultPop {
      0% { opacity: 0; transform: scale(.75); }
      70% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    .timer {
      width: min(92vw, 380px);
      margin: 15px auto 0;
      padding: 13px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,20,147,.07);
      color: var(--muted);
      font-size: 13px;
      display: none;
    }

    .timer.show {
      display: block;
    }

    .timer strong {
      display: block;
      margin-top: 3px;
      color: #fff;
      font-size: 21px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--pink);
    }

    .footer {
      margin-top: 20px;
      color: #b985aa;
      font-size: 11px;
    }

    .footer span {
      color: var(--pink);
      text-shadow: 0 0 8px var(--pink);
    }

    .spark {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      font-size: 22px;
      animation: spark .9s ease-out forwards;
    }

    @keyframes spark {
      from { transform: translate(0,0) scale(.7); opacity: 1; }
      to   { transform: translate(var(--x),var(--y)) scale(1.3); opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="hearts" aria-hidden="true">
    <div class="heart">♥</div>
    <div class="heart">♡</div>
    <div class="heart">♥</div>
    <div class="heart">♡</div>
    <div class="heart">♥</div>
    <div class="heart">♡</div>
    <div class="heart">♥</div>
    <div class="heart">♡</div>
  </div>

  <main class="app">
    <div class="brand">♥ TWOJA SZANSA ♥</div>
    <h1>KOŁO FORTUNY</h1>
    <div class="subtitle">Zakręć kołem i odbierz swoją nagrodę ✨</div>

    <div class="wheel-area">
      <div class="pointer"></div>
      <canvas id="wheel" width="900" height="900"></canvas>
      <div class="neon-ring"></div>
      <div class="center">♥<br>FORTUNA</div>
    </div>

    <button id="spinButton" class="spin-button">♥ ZAKRĘĆ KOŁEM ♥</button>

    <div id="result" class="result"></div>

    <div id="timer" class="timer"></div>

    <div class="footer">
      Jedno losowanie na <span>24 godziny</span> ♥
    </div>
  </main>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;

    if (tg) {
      tg.ready();
      tg.expand();

      try {
        tg.setHeaderColor("#09020d");
        tg.setBackgroundColor("#09020d");
      } catch (e) {}
    }

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const resultBox = document.getElementById("result");
    const timerBox = document.getElementById("timer");

    /*
      Nagrody:
      - PAKIET jest najlepszą nagrodą i jest rzadszy.
      - Zniżki: 5%, 10%, 15%.
      - Pozostałe pola: SPRÓBUJ PONOWNIE.
    */
    const prizes = [
      { name: "PAKIET", emoji: "🎁", color: "#ff1493", weight: 2 },
      { name: "ZNIŻKA 15%", emoji: "💗", color: "#8b0053", weight: 8 },
      { name: "SPRÓBUJ PONOWNIE", emoji: "♥", color: "#26091f", weight: 18 },
      { name: "ZNIŻKA 10%", emoji: "💗", color: "#d40078", weight: 12 },
      { name: "SPRÓBUJ PONOWNIE", emoji: "♥", color: "#3a0b2d", weight: 18 },
      { name: "ZNIŻKA 5%", emoji: "💗", color: "#ff4db8", weight: 17 },
      { name: "SPRÓBUJ PONOWNIE", emoji: "♥", color: "#210718", weight: 17 },
      { name: "ZNIŻKA 10%", emoji: "💗", color: "#a80060", weight: 8 }
    ];

    const TAU = Math.PI * 2;
    const segment = TAU / prizes.length;
    let rotation = 0;
    let spinning = false;

    function drawWheel() {
      const c = canvas.width / 2;
      const r = canvas.width / 2 - 16;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < prizes.length; i++) {
        const start = rotation + i * segment;
        const end = start + segment;

        ctx.beginPath();
        ctx.moveTo(c, c);
        ctx.arc(c, c, r, start, end);
        ctx.closePath();

        ctx.fillStyle = prizes[i].color;
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,.75)";
        ctx.lineWidth = 7;
        ctx.stroke();

        ctx.save();
        ctx.translate(c, c);
        ctx.rotate(start + segment / 2);

        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.shadowColor = "#ff1493";
        ctx.shadowBlur = 10;

        const small = prizes[i].name === "SPRÓBUJ PONOWNIE";
        ctx.font = small ? "900 22px Arial" : "900 29px Arial";

        ctx.fillText(prizes[i].name, r - 30, 8);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(c, c, r, 0, TAU);
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 9;
      ctx.shadowColor = "#ff1493";
      ctx.shadowBlur = 18;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    drawWheel();

    function choosePrize() {
      const total = prizes.reduce((sum, p) => sum + p.weight, 0);
      let value = Math.random() * total;

      for (let i = 0; i < prizes.length; i++) {
        value -= prizes[i].weight;
        if (value <= 0) return i;
      }
      return prizes.length - 1;
    }

    function normalize(a) {
      return ((a % TAU) + TAU) % TAU;
    }

    const STORAGE_KEY = "last_spin_timestamp";
    const LIMIT = 24 * 60 * 60 * 1000;

    function cloudStorage() {
      if (tg && tg.CloudStorage) return tg.CloudStorage;
      return null;
    }

    function getLastSpin(callback) {
      const cloud = cloudStorage();

      if (cloud) {
        cloud.getItem(STORAGE_KEY, (error, value) => {
          if (error) {
            callback(null);
            return;
          }
          callback(value ? Number(value) : null);
        });
        return;
      }

      const value = localStorage.getItem(STORAGE_KEY);
      callback(value ? Number(value) : null);
    }

    function saveLastSpin(time) {
      const cloud = cloudStorage();

      if (cloud) {
        cloud.setItem(STORAGE_KEY, String(time), () => {});
      } else {
        localStorage.setItem(STORAGE_KEY, String(time));
      }
    }

    function remainingTime(last) {
      return Math.max(0, LIMIT - (Date.now() - last));
    }

    function formatTime(ms) {
      const s = Math.ceil(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;

      return String(h).padStart(2, "0") + ":" +
             String(m).padStart(2, "0") + ":" +
             String(sec).padStart(2, "0");
    }

    function updateLimit() {
      getLastSpin(last => {
        if (!last) {
          spinButton.disabled = false;
          spinButton.textContent = "♥ ZAKRĘĆ KOŁEM ♥";
          timerBox.classList.remove("show");
          return;
        }

        const left = remainingTime(last);

        if (left <= 0) {
          spinButton.disabled = false;
          spinButton.textContent = "♥ ZAKRĘĆ KOŁEM ♥";
          timerBox.classList.remove("show");
          return;
        }

        spinButton.disabled = true;
        spinButton.textContent = "♥ WRÓĆ PÓŹNIEJ ♥";
        timerBox.classList.add("show");
        timerBox.innerHTML =
          "Twoje kolejne losowanie będzie dostępne za:" +
          "<strong>" + formatTime(left) + "</strong>";
      });
    }

    function makeHearts() {
      const chars = ["♥", "♡", "♥", "♡", "♥"];
      for (let i = 0; i < 14; i++) {
        const el = document.createElement("div");
        el.className = "spark";
        el.textContent = chars[Math.floor(Math.random() * chars.length)];
        el.style.left = (50 + (Math.random() * 16 - 8)) + "%";
        el.style.top = (50 + (Math.random() * 16 - 8)) + "%";
        el.style.color = i % 2 ? "#ff8bd2" : "#ff1493";
        el.style.setProperty("--x", (Math.random() * 260 - 130) + "px");
        el.style.setProperty("--y", (Math.random() * 260 - 130) + "px");
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 950);
      }
    }

    function showResult(prize) {
      resultBox.innerHTML =
        '<span class="big-heart">♥</span>' +
        '<div class="won">GRATULACJE!</div>' +
        '<div class="prize">' + prize.emoji + " " + prize.name + "</div>";

      resultBox.classList.add("show");
      makeHearts();

      if (tg && tg.HapticFeedback) {
        try {
          tg.HapticFeedback.notificationOccurred("success");
        } catch (e) {}
      }
    }

    function spin() {
      if (spinning) return;

      getLastSpin(last => {
        if (last && remainingTime(last) > 0) {
          updateLimit();
          return;
        }

        spinning = true;
        spinButton.disabled = true;
        resultBox.classList.remove("show");

        const winner = choosePrize();

        /*
          Pointer jest na górze (-PI/2).
          Ustawiamy środek wybranego pola pod pointerem.
        */
        const targetCenter = winner * segment + segment / 2;
        const pointer = -Math.PI / 2;
        const current = normalize(rotation);

        let diff = normalize(pointer - targetCenter) - current;
        if (diff < 0) diff += TAU;

        const extraTurns = (5 + Math.floor(Math.random() * 3)) * TAU;

        const start = rotation;
        const finish = rotation + diff + extraTurns;
        const duration = 5200;
        const startTime = performance.now();

        function animate(now) {
          const progress = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - progress, 4);

          rotation = start + (finish - start) * ease;
          drawWheel();

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            rotation = finish;
            drawWheel();

            saveLastSpin(Date.now());

            setTimeout(() => {
              showResult(prizes[winner]);
              spinning = false;
              updateLimit();
            }, 250);
          }
        }

        requestAnimationFrame(animate);
      });
    }

    spinButton.addEventListener("click", spin);
    setInterval(updateLimit, 1000);
    updateLimit();
  </script>
</body>
</html>
